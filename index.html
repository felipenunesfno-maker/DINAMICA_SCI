'use strict';
const cases=[
{name:'Marina',role:'Analista de operações',tag:'Agilidade × continuidade',short:'Entrega muito. Registra pouco.',skin:'#925d43',hair:'#282e30',shirt:'#b86348',bg:'#d7e5ec',hairtype:'curl',story:'Marina é procurada quando uma demanda precisa andar. Resolve problemas rapidamente e recebe elogios dos clientes. Agora, você precisa conversar sobre o que fica depois da solução.',behavior:'Nos últimos cinco dias, três processos foram concluídos sem atualização no sistema compartilhado.',impact:'Dois colegas refizeram consultas. Um cliente recebeu informações divergentes sobre o andamento da mesma demanda.',proof:'“O cliente disse que já estava resolvido, mas no sistema continua pendente. Qual informação vale?” — mensagem de um colega.',hidden:'Tenho feito um controle paralelo. Quando paro para atualizar tudo, ouço que preciso ser mais rápida. Achei que o mais importante era resolver primeiro.',opening:'Quero entender como você está organizando as demandas e os registros.',direct:'Quero conversar sobre os três processos que ficaram sem atualização nesta semana.',accuse:'Você precisa se comprometer mais com o time.',defense:'Eu resolvo tanta coisa todos os dias… Parece que só aparece o que faltou.',neutral:'Eu sei que alguns registros ficaram para depois. Achei que não iam fazer tanta diferença.',barrier:'Se eu parar para registrar tudo, como equilibro isso com as urgências que chegam o tempo inteiro?',solution:'Podemos definir quais informações são essenciais e reservar um momento de atualização antes de encerrar cada demanda?',learning:'Agilidade e continuidade precisam estar no mesmo acordo. Explore expectativas conflitantes antes de concluir que faltou compromisso.',focus:'Certeza e justiça',tips:['Descreva os três processos sem generalizar a atuação de Marina.','Conecte o registro à continuidade do trabalho, não a uma preferência sua.','Reconheça a agilidade apenas se isso contribuir de verdade para a conversa.'],sample:'Nas três entregas desta semana, os registros não foram atualizados no sistema. Isso levou colegas a repetir consultas e gerou informação divergente ao cliente.'},
{name:'Rafael',role:'Especialista da operação',tag:'Experiência × participação',short:'Conhece o caminho. Ocupa a conversa.',skin:'#c18a68',hair:'#4d4541',shirt:'#285a81',bg:'#eadbcd',hairtype:'short',story:'Rafael tem muitos anos de operação e identifica riscos rapidamente. Na reunião mais recente, sua participação acabou reduzindo o espaço de outras pessoas.',behavior:'Na última reunião de planejamento, Rafael interrompeu quatro falas de colegas antes que concluíssem a proposta.',impact:'Duas propostas ficaram sem discussão e uma colega desistiu de apresentar sua análise.',proof:'“Eu queria terminar o raciocínio, mas depois preferi deixar para outra hora.” — relato de uma participante.',hidden:'Eu já vi esse tipo de proposta dar errado. Achei que estava evitando retrabalho e protegendo o time. Não percebi que impedi as pessoas de concluir.',opening:'Como você percebeu sua participação e o espaço dos colegas na última reunião?',direct:'Quero falar sobre as quatro interrupções na reunião de planejamento.',accuse:'Você sempre quer ser o dono da razão.',defense:'Então agora minha experiência é um problema? Eu estava tentando evitar um erro.',neutral:'Interrompi porque vi riscos. Não foi minha intenção impedir ninguém de falar.',barrier:'E se eu perceber um risco importante enquanto alguém está falando? Tenho que ficar quieto?',solution:'Posso anotar o risco e esperar a pessoa concluir. Se for algo crítico, posso pedir uma pausa, explicando por quê.',learning:'Preserve a contribuição da experiência enquanto torna claro o comportamento que limita outras vozes.',focus:'Status e relações',tips:['Descreva interrupções observadas, sem definir Rafael como arrogante.','Explique o impacto na participação e na qualidade da discussão.','Construa uma forma de sinalizar riscos sem silenciar os colegas.'],sample:'Na reunião de planejamento, você interrompeu quatro falas antes da conclusão. Duas propostas não foram discutidas e uma colega deixou de apresentar sua análise.'},
{name:'Júlia',role:'Analista em integração',tag:'Cuidado × autonomia',short:'Quer acertar. Valida cada decisão.',skin:'#d39b77',hair:'#443129',shirt:'#668d9d',bg:'#e2e6dc',hairtype:'long',story:'Júlia está há dois meses na equipe. Demonstra cuidado e disposição para aprender, mas encaminha ao líder decisões rotineiras que estavam dentro da autonomia combinada.',behavior:'Nesta semana, seis decisões dentro do limite de autonomia acordado foram encaminhadas ao líder para aprovação.',impact:'Três demandas ficaram aguardando uma resposta, e o atendimento se tornou dependente da disponibilidade do líder.',proof:'“Posso seguir com a alternativa A? Sei que já conversamos, mas prefiro confirmar antes.” — mensagem de Júlia.',hidden:'Recebi uma orientação sua e outra diferente de uma pessoa mais experiente. Fiquei com medo de escolher errado e ser responsabilizada depois.',opening:'O que tem feito você buscar validação nessas decisões?',direct:'Quero revisar as seis decisões que você encaminhou nesta semana e nossa combinação de autonomia.',accuse:'Você precisa parar de ser tão insegura.',defense:'Eu só queria fazer certo. Não quero causar um problema por agir sem perguntar.',neutral:'Eu prefiro confirmar. Algumas situações me pareceram diferentes do que combinamos.',barrier:'Se a orientação de outra pessoa for diferente da sua, qual eu sigo? E quando devo pedir ajuda?',solution:'Podemos registrar os limites e alguns exemplos? Assim, eu sigo sozinha dentro deles e sinalizo as exceções.',learning:'Autonomia depende de limites compreensíveis. Investigue a clareza das orientações antes de atribuir o comportamento à insegurança.',focus:'Certeza e autonomia',tips:['Não transforme pedidos de validação em um rótulo de personalidade.','Confira se o limite de autonomia foi realmente compreendido.','Diferencie decisões rotineiras de exceções que exigem apoio.'],sample:'Nesta semana, seis decisões dentro do limite combinado foram encaminhadas para aprovação. Três demandas aguardaram resposta, aumentando a dependência da minha disponibilidade.'},
{name:'André',role:'Analista de projetos',tag:'Consistência × prioridades',short:'Sempre entregou. Algo mudou.',skin:'#a16a4b',hair:'#292a2a',shirt:'#59695c',bg:'#dbe3e9',hairtype:'short',story:'André construiu um histórico de entregas consistentes. Nas últimas semanas, o padrão mudou. Você quer entender o que aconteceu e restabelecer um acordo de trabalho.',behavior:'As duas últimas entregas chegaram após o prazo, sem aviso prévio de risco de atraso.',impact:'A equipe reorganizou atividades de última hora e adiou uma etapa que dependia dessas entregas.',proof:'“Se eu soubesse ontem, teria reorganizado a agenda. Descobri o atraso na hora de começar.” — mensagem da equipe.',hidden:'Duas áreas passaram a me pedir urgências ao mesmo tempo. Tentei atender todo mundo e achei que ainda daria conta. Faltou avisar que os prazos estavam em risco.',opening:'Percebi uma mudança nas entregas. O que aconteceu nas últimas semanas?',direct:'Precisamos conversar sobre os dois atrasos e a falta de aviso sobre os riscos.',accuse:'Você perdeu o interesse no trabalho?',defense:'Não é falta de interesse. Estou tentando segurar mais coisas do que vocês estão vendo.',neutral:'Eu achei que conseguiria recuperar o prazo. Acabei não avisando a tempo.',barrier:'Se duas áreas continuarem me pedindo urgência, como eu decido o que fica para depois?',solution:'Preciso de um critério de prioridade e de alguém para alinhar os conflitos entre as áreas. Posso sinalizar o risco assim que perceber.',learning:'Separar a responsabilidade de avisar dos conflitos de prioridade permite cobrar uma ação possível e assumir o apoio que cabe à liderança.',focus:'Justiça e certeza',tips:['Use o histórico como contexto, não como cobrança emocional.','Diferencie o atraso da ausência de comunicação sobre o risco.','Não prometa resolver conflitos entre áreas sem definir como fará isso.'],sample:'As duas últimas entregas chegaram após o prazo, sem aviso prévio de risco. A equipe precisou reorganizar atividades e adiar uma etapa dependente.'}
];

adores.</div>'+ (state.history.length?'<button class="quiet" data-action="archive">Ver minhas conversas salvas ('+state.history.length+')</button>':'');return}
let c=cases[state.id],html='';
if(state.step===1)html='<div class="eyebrow">01 · Briefing da conversa</div><h2>'+c.short+'</h2><p class="lead">'+c.story+'</p><div class="evidence"><b>O que aconteceu</b><p>'+c.behavior+'</p></div><div class="evidence"><b>O efeito</b><p>'+c.impact+'</p></div><div class="speech"><div class="who">Registro da equipe / evidência do caso</div><p>'+c.proof+'</p></div><p class="muted">Você já tem fatos para começar. O que ainda precisa entender?</p><button class="btn" data-action="next">Escolher minha abertura →</button>';
if(state.step===2)html='<div class="eyebrow">02 · A primeira frase abre uma direção</div><h2>Como você<br><em>começa?</em></h2><p>Escolha a frase que você usaria. Depois, observe o que ela pode provocar.</p>'+[c.opening,c.direct,c.accuse].map((t,i)=>'<button class="choice '+(state.opening===i?'sel':'')+'" data-open="'+i+'">“'+t+'”</button>').join('')+'<p class="small muted">Não é uma prova de adivinhação. É uma oportunidade de experimentar sua postura.</p>';
if(state.step===3){let response=[c.hidden,c.neutral,c.defense][state.opening??0];html='<div class="eyebrow">03 · Uma resposta possível</div><h2>Antes de concluir,<br><em>escute.</em></h2><div class="speech"><div class="who">'+c.name+' responde</div><p>“'+response+'”</p></div><div class="note"><b class="consequence-label">O QUE SUA ABERTURA PRODUZIU</b>'+['Uma pergunta aberta trouxe contexto antes da sua análise. Ainda será necessário explicitar o impacto.','Você nomeou o fato com clareza. Agora há espaço para investigar o que o produziu.','A frase atribui uma característica ou intenção à pessoa. Você pode retomar a conversa focando no episódio.'][state.opening??0]+'</div>'+(state.opening!==0?'<button class="choice" data-action="reveal">Perguntar: “O que estava acontecendo para você nessa situação?”</button>':'<span class="pill">Contexto revelado pela escuta</span>')+'<div id="extra">'+(state.revealed&&state.opening!==0?'<div class="speech"><div class="who">'+c.name+' explica</div><p>“'+c.hidden+'”</p></div>':'')+'</div><div class="actions"><button class="btn" data-action="next">Preparar meu feedback →</button></div>';}
if(state.step===4){let m=methods[state.method],f=state.field;html='<div class="eyebrow">04 · Estrutura para apoiar</div><h2>Sua mensagem.<br><em>Suas palavras.</em></h2><p class="sci-intro"><strong>SCI</strong> Situação · Comportamento · Impacto</p><p class="hint">Prepare um elemento por vez. Sua fala completa aparece abaixo.</p><div class="fieldnav">'+m.fields.map((a,i)=>'<button class="'+(i===f?'active':'')+'" data-field="'+i+'">'+(i+1)+'. '+a[0]+'</button>').join('')+'</div><div class="writing"><div class="field"><label for="draft">'+m.fields[f][0]+'</label><p class="hint">'+m.fields[f][1]+'</p><textarea id="draft" placeholder="'+m.fields[f][2]+'">'+esc(drafts()[f])+'</textarea><div class="actions"><button class="quiet" data-action="hint">Preciso de uma pista</button>'+ (f<m.fields.length-1?'<button class="btn" data-action="fieldnext">Próximo elemento →</button>':'<button class="btn" data-action="draftdone">Continuar a conversa →</button>')+'</div><div id="error" class="error" role="alert"></div></div><div class="preview"><h3>Minha fala até aqui</h3><p id="preview">'+esc(assembled()||'Sua mensagem aparecerá aqui enquanto você escreve.')+'</p></div></div>';}
if(state.step===5)html='<div class="eyebrow">05 · O outro também participa</div><h2>A conversa<br><em>não acabou.</em></h2><p class="small muted">Esta resposta é uma continuação do caso. Não é uma análise automática do texto que você escreveu.</p><div class="speech"><div class="who">'+c.name+' traz uma dificuldade</div><p>“'+c.barrier+'”</p></div><h3>Como você continua?</h3>'+['“O que você sugere para conseguirmos cumprir o combinado?”','“Isso precisa mudar. Vamos esclarecer o limite e o apoio necessário.”','“Você precisa dar um jeito. Não posso resolver tudo.”'].map((t,i)=>'<button class="choice '+(state.follow===i?'sel':'')+'" data-follow="'+i+'">'+t+'</button>').join('')+(state.follow!==null?'<div class="speech"><div class="who">Uma continuação possível</div><p>“'+(state.follow===2?'Eu posso tentar, mas continuo sem saber como lidar com essa dificuldade.':c.solution)+'”</p></div><div class="note"><b class="consequence-label">O EFEITO DA SUA CONDUÇÃO</b>'+(state.follow===2?'A cobrança deixou o obstáculo sem resposta. Use o próximo passo para definir responsabilidade e apoio concretos.':state.follow===0?'Você abriu participação. Transforme a proposta em um acordo com prazo e acompanhamento.':'Você manteve a expectativa e abriu espaço para apoio. Verifique se o acordo é compreensível e viável.')+'</div><button class="btn" data-action="next">Construir o acordo →</button>':'');
if(state.step===6)html='<div class="eyebrow">06 · Do diálogo ao acordo</div><h2>O próximo passo<br><em>precisa caber na vida.</em></h2><p>'+c.solution+'</p>'+[['action','O que muda?','Descreva uma ação observável.'],['when','Até quando?','Defina uma data ou um prazo concreto.'],['support','Com qual apoio?','O que cabe à liderança e o que cabe ao colaborador?'],['review','Quando vamos retomar?','Combine uma data ou situação para verificar o resultado.']].map(([k,l,h])=>'<div class="field"><label for="'+k+'">'+l+'</label><p class="hint">'+h+'</p><input id="'+k+'" data-plan="'+k+'" value="'+esc(state.plan[k])+'"></div>').join('')+'<div id="error" class="error" role="alert"></div><button class="btn" data-action="plandone">Rever minha condução →</button>';
if(state.step===7)html=review();
if(state.step===8)html='<div class="eyebrow">08 · Da simulação para sua liderança</div><h2>Agora, do outro lado<br><em>está alguém da sua equipe.</em></h2><p class="lead">Pense em uma conversa de feedback que hoje desafia você. O que esta experiência mostrou que você pode fazer diferente já amanhã?</p>'+[['conversation','A conversa que preciso ter…','Descreva a situação, sem precisar citar nomes.'],['different','O que vou fazer diferente…','Qual atitude ou ferramenta desta experiência você vai levar?'],['tomorrow','Meu primeiro passo amanhã será…','Escolha uma ação pequena e concreta.']].map(([k,l,h])=>'<div class="field"><label for="'+k+'">'+l+'</label><p class="hint">'+h+'</p><textarea id="'+k+'" data-commit="'+k+'">'+esc(state.commit[k])+'</textarea></div>').join('')+'<div id="error" class="error" role="alert"></div><button class="btn" data-action="finish">Guardar meu compromisso →</button><p class="lead" style="margin-top:30px">Você ensaiou aqui.<br><em>O próximo passo acontece na sua liderança.</em></p>';
$('app').innerHTML=shell(html);bindInputs();}
function review(){let c=cases[state.id];return '<div class="eyebrow">07 · Reveja sua condução</div><h2>Sua conversa.<br><em>Seu impacto.</em></h2><p>'+c.learning+'</p><div class="checks"><span class="check">Abertura escolhida</span><span class="check">'+methods[state.method].name+' preenchido</span><span class="check">Ação e apoio registrados</span><span class="check">Retomada definida</span></div><p class="hint">Esses registros confirmam etapas preenchidas. A qualidade da sua fala será revisada por você.</p><div class="journal"><h3>O contexto que estava faltando</h3><p>'+c.hidden+'</p></div><div class="journal"><h3>Sua abertura</h3><p>'+[c.opening,c.direct,c.accuse][state.opening??0]+'</p></div><div class="journal"><h3>Sua fala · '+methods[state.method].name+'</h3><p>'+esc(assembled())+'</p></div><div class="journal"><h3>O acordo</h3><p><b>Ação:</b> '+esc(state.plan.action)+'<br><b>Prazo:</b> '+esc(state.plan.when)+'<br><b>Apoio:</b> '+esc(state.plan.support)+'<br><b>Retomada:</b> '+esc(state.plan.review)+'</p></div><div class="note"><b>Revise com atenção ao SCARF: '+c.focus+'.</b><br>'+c.tips.join('<br>')+'</div><div class="actions"><button class="quiet" data-action="edit-sci">Ajustar meu SCI</button></div><div class="actions"><button class="btn" data-action="next">Levar para a minha liderança →</button><button class="quiet" data-action="download">Baixar resumo</button></div>'}
function bindInputs(){if($('draft'))$('draft').oninput=e=>{drafts()[state.field]=e.target.value;save();$('preview').textContent=assembled()||'Sua mensagem aparecerá aqui enquanto você escreve.'};document.querySelectorAll('[data-plan]').forEach(el=>el.oninput=()=>{state.plan[el.dataset.plan]=el.value;save()});document.querySelectorAll('[data-commit]').forEach(el=>el.oninput=()=>{state.commit[el.dataset.commit]=el.value;save()})}
function error(t){$('error').textContent=t;$('error').scrollIntoView({block:'center',behavior:'smooth'})}
function summary(){let c=cases[state.id];return 'DO OUTRO LADO — LABORATÓRIO DE CONVERSAS\nUma experiência do T&D - Asia Shipping\n\nPERSONAGEM: '+c.name+' (caso fictício)\n'+c.story+'\n\nCOMPORTAMENTO\n'+c.behavior+'\n\nIMPACTO\n'+c.impact+'\n\nCONTEXTO\n'+c.hidden+'\n\nABERTURA\n'+[c.opening,c.direct,c.accuse][state.opening??0]+'\n\n'+Object.entries(methods).filter(([k])=>(state.drafts[k]||[]).some(Boolean)).map(([k,m])=>m.name.toUpperCase()+'\n'+m.fields.map(([n],i)=>n+': '+((state.drafts[k]||[])[i]||'(não preenchido / opcional)')).join('\n')).join('\n\n')+'\n\nACORDO\nAção: '+(state.plan.action||'')+'\nPrazo: '+(state.plan.when||'')+'\nApoio: '+(state.plan.support||'')+'\nRetomada: '+(state.plan.review||'')+'\n\nCOMPROMISSO PESSOAL\nA conversa que preciso ter: '+(state.commit.conversation||'')+'\nO que vou fazer diferente: '+(state.commit.different||'')+'\nMeu primeiro passo amanhã: '+(state.commit.tomorrow||'')+'\n\nVocê ensaiou aqui. O próximo passo acontece na sua liderança.\n\nDesenvolvido por Felipe Nunes - Treinamento & Desenvolvimento';}
function download(text,name){const u=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function finalView(){let c=cases[state.id];$('app').innerHTML='<section class="fade"><div class="eyebrow">Experiência concluída · '+c.name+'</div><h2>Você ensaiou aqui.<br><em>Agora é com você.</em></h2><p class="lead">Uma conversa preparada. Um compromisso para amanhã.</p><div class="commit"><div class="journal"><h3>A conversa que preciso ter</h3><p>'+esc(state.commit.conversation)+'</p></div><div class="journal"><h3>O que vou fazer diferente</h3><p>'+esc(state.commit.different)+'</p></div><div class="journal"><h3>Meu primeiro passo amanhã</h3><p>'+esc(state.commit.tomorrow)+'</p></div></div><div class="actions no-print"><button class="btn" data-action="download">Baixar meu resumo completo ↓</button><button class="btn secondary" data-action="print">Imprimir / salvar PDF</button><button class="quiet" data-action="review">Rever conversa</button><button class="quiet" data-action="home">Explorar outro personagem →</button></div><p class="small muted no-print" style="margin-top:18px">Na impressão, escolha “Salvar como PDF” para guardar este compromisso. O resumo completo inclui seu feedback SCI e o acordo.</p></section>';window.scrollTo(0,0)}
function modal(title,body){$('overlay').innerHTML='<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h2>'+title+'</h2>'+body+'<div class="actions"><button class="btn" data-action="close">Fechar</button></div></section></div>';$('overlay').querySelector('button').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.case!==undefined){const i=Number(b.dataset.case);if(state.started&&state.id===i&&!state.finished){go(state.lastStep||1);return}if(state.started&&state.id!==null&&!state.finished){if(!confirm('Abrir este caso inicia uma nova conversa. Baixe o resumo atual se quiser guardá-lo. Continuar?'))return}start(i);return}if(b.dataset.open!==undefined){state.opening=Number(b.dataset.open);go(3);return}if(b.dataset.follow!==undefined){state.follow=Number(b.dataset.follow);save();render();return}if(b.dataset.field!==undefined){state.field=Number(b.dataset.field);save();render();return}const a=b.dataset.action;if(!a)return;
if(a==='explore'){document.getElementById('cases').scrollIntoView({behavior:'smooth',block:'start'})}if(a==='next')go(state.step+1);if(a==='back')go(state.step-1);if(a==='resume'){state.id=state.lastId??state.id??0;go(state.lastStep||1)}if(a==='home'){home()}if(a==='reveal'){$('extra').innerHTML='<div class="speech"><div class="who">'+cases[state.id].name+' explica</div><p>“'+cases[state.id].hidden+'”</p></div><span class="pill">Você investigou antes de concluir</span>';b.disabled=true;b.textContent='Contexto revelado';state.revealed=true;save()}if(a==='fieldnext'){if(String(drafts()[state.field]||'').trim().length<5){error('Escreva este elemento antes de continuar.');return}state.field++;save();render()}if(a==='draftdone'){if(!complete()){error('Preencha Situação, Comportamento e Impacto para continuar.');return}if(state.editingSCI){state.editingSCI=false;go(7)}else go(5)}if(a==='hint')modal('Uma pista, não uma fala pronta','<p>'+cases[state.id].tips.join('</p><p>')+'</p><div class="note">Exemplo de fatos do caso:<br>'+cases[state.id].sample+'</div>');if(a==='plandone'){if(['action','when','support','review'].some(k=>!String(state.plan[k]||'').trim())){error('Complete os quatro pontos para construir um acordo verificável.');return}go(7)}if(a==='edit-sci'){state.field=0;state.editingSCI=true;go(4)}if(a==='finish'){if(['conversation','different','tomorrow'].some(k=>!String(state.commit[k]||'').trim())){error('Registre as três reflexões para guardar seu compromisso.');return}state.finished=true;if(!state.done.includes(state.id))state.done.push(state.id);state.history.push({name:cases[state.id].name,date:new Date().toLocaleDateString('pt-BR'),text:summary()});state.history=state.history.slice(-20);save();finalView()}if(a==='download')download(summary(),'Minha_Conversa_'+cases[state.id].name+'.txt');if(a==='print')window.print();if(a==='review'){state.finished=false;go(7)};if(a==='close')$('overlay').innerHTML='';if(a==='archive')modal('Minhas conversas','<p class="small">Registros guardados neste navegador.</p>'+state.history.map((h,i)=>'<button class="choice" data-history="'+i+'">'+esc(h.name)+' · '+esc(h.date)+'<span>Baixar resumo desta experiência</span></button>').join(''));if(b.dataset.history!==undefined){let h=state.history[Number(b.dataset.history)];download(h.text,'Conversa_'+h.name+'.txt')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-history]');if(b){const h=state.history[Number(b.dataset.history)];download(h.text,'Conversa_'+h.name+'.txt')}});
function home(){if(state.step){state.lastStep=state.step;state.lastId=state.id}state.step=0;save();render();window.scrollTo(0,0)}$('home').onclick=home;$('help').onclick=()=>modal('Como funciona','<p>Escolha um personagem, investigue o contexto e prepare uma conversa com o método SCI: Situação, Comportamento e Impacto.</p><p>As escolhas revelam respostas previamente construídas. O texto livre é seu: a experiência não usa IA para avaliar sua fala nem atribui notas de empatia.</p><p>Ao final, revise seu SCI, defina um acordo e registre o que vai aplicar amanhã.</p><p class="small">Funciona sem internet. Se o navegador permitir, o progresso fica salvo neste dispositivo. Evite nomes e informações confidenciais nas reflexões. Use o download para guardar seu registro.</p><p class="small">Referências de aprendizagem: SCI (Center for Creative Leadership), SCARF (David Rock) e estruturas trabalhadas no treinamento. Casos, adaptações e experiência desenvolvidos para esta prática.</p>');document.addEventListener('keydown',e=>{if(e.key==='Escape')$('overlay').innerHTML='';if(e.key==='Tab'&&$('overlay').firstChild){const list=[...$('overlay').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}});render();
</script></body></html>
